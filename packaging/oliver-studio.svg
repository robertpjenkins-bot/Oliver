<?xml version="1.0" encoding="UTF-8"?>
<!-- The studio's icon: a screen with a game on it, drawn on the pixel grid the
     studio itself works in, so it reads as a game maker rather than as a tool. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b44"/>
      <stop offset="1" stop-color="#15151f"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#case)"/>
  <rect x="20" y="24" width="88" height="62" rx="4" fill="#0b0f1e"/>

  <!-- sky, ground and a platform -->
  <rect x="24" y="66" width="80" height="16" fill="#3a2a1c"/>
  <rect x="24" y="66" width="80" height="4" fill="#5fbf5f"/>
  <rect x="64" y="52" width="24" height="4" fill="#7a7192"/>

  <!-- a hero mid-jump -->
  <rect x="36" y="46" width="10" height="4" fill="#f2c94c"/>
  <rect x="36" y="50" width="10" height="6" fill="#d8b48a"/>
  <rect x="38" y="52" width="2" height="2" fill="#15151f"/>
  <rect x="42" y="52" width="2" height="2" fill="#15151f"/>
  <rect x="34" y="56" width="14" height="8" fill="#d94f4f"/>
  <rect x="34" y="64" width="4" height="4" fill="#f2c94c"/>
  <rect x="44" y="64" width="4" height="4" fill="#f2c94c"/>

  <!-- a coin to collect -->
  <circle cx="80" cy="40" r="7" fill="#e0a83c"/>
  <circle cx="80" cy="40" r="3" fill="#f7d154"/>

  <!-- the controls under the screen -->
  <rect x="30" y="96" width="6" height="14" rx="1" fill="#7a7192"/>
  <rect x="24" y="100" width="18" height="6" rx="1" fill="#7a7192"/>
  <circle cx="90" cy="99" r="6" fill="#d94f4f"/>
  <circle cx="102" cy="107" r="6" fill="#3fa9f5"/>
</svg>
