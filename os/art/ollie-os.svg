<svg xmlns="http://www.w3.org/2000/svg" viewBox="-112 -112 224 224" width="256" height="256">
  <!-- Ollie OS cube: three faces of an isometric cube, lit from the top. -->
  <g stroke="#0b4f4a" stroke-width="5" stroke-linejoin="round">
    <polygon points="0,-100 86.6,-50 0,0 -86.6,-50" fill="#ffffff"/>
    <polygon points="-86.6,-50 0,0 0,100 -86.6,50" fill="#9eeee4"/>
    <polygon points="0,0 86.6,-50 86.6,50 0,100" fill="#2dd4bf"/>
  </g>
</svg>
