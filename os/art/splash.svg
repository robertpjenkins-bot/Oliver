<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <!-- Background of the BIOS boot menu. The menu text is drawn over the lower half. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="25%" r="80%">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="0.6" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#083c38"/>
    </radialGradient>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <g transform="translate(320 110) scale(0.62)" stroke="#0b4f4a" stroke-width="4" stroke-linejoin="round">
    <polygon points="0,-100 86.6,-50 0,0 -86.6,-50" fill="#ffffff"/>
    <polygon points="-86.6,-50 0,0 0,100 -86.6,50" fill="#9eeee4"/>
    <polygon points="0,0 86.6,-50 86.6,50 0,100" fill="#2dd4bf"/>
  </g>
</svg>
