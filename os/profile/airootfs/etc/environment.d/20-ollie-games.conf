# FPS counter (MangoHud) in the top right corner of every game: how many
# pictures a second the game draws. Right Shift + F12 hides it in a game;
# Ollie OS Settings switches it off (no_display in ~/.config/MangoHud/MangoHud.conf).
MANGOHUD=1
MANGOHUD_CONFIG=read_cfg,fps_only,position=top-right,font_size=28,background_alpha=0.45,round_corners=8,toggle_hud=Shift_R+F12
