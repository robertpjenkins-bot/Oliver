# Ollie OS's start-up animation (Plymouth) on an installed Ollie OS; its boot
# menu entries ask for it with "splash". The live USB (the archiso hooks)
# goes without, so its start-up image stays small. (mkinitcpio reads this
# as bash.)
if [[ " ${HOOKS[*]} " != *" archiso "* && -e /usr/lib/initcpio/install/plymouth ]]; then
    HOOKS+=(plymouth)
fi
