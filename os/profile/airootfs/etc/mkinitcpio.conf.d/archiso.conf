# Initramfs for booting the live USB (releng's hooks without network boot).
# Without the kms hook: it copies every graphics card's firmware into the
# initramfs (twice on the ISO), and the graphics driver loads from the
# system image a moment later anyway. That keeps the ISO under 2 GB.
# The installer deletes this file so the installed system uses the defaults.
HOOKS=(base udev microcode modconf memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
