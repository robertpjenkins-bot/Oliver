# Start the login screen only once the graphics card is ready. The live
# system loads the graphics driver from the system image (not the initramfs),
# so on some machines and virtual machines (GNOME Boxes) the login screen
# could start before it and fail, leaving a text "login:" prompt.
[Service]
ExecStartPre=-/bin/sh -c 'udevadm settle --timeout=20; for i in $(seq 40); do ls /dev/dri/card* >/dev/null 2>&1 && exit 0; sleep 0.5; done; exit 0'
# If it still fails, try again instead of giving up.
Restart=always
RestartSec=3
StartLimitIntervalSec=0
