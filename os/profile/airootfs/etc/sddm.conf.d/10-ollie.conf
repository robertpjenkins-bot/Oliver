# Login screen: the Breeze theme (its background is set in
# /usr/share/sddm/themes/breeze/theme.conf.user) running on KWin's Wayland
# compositor, so no X server needs to be installed.
[Theme]
Current=breeze
CursorTheme=breeze_cursors

[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
