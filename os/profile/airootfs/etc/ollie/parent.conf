# Ollie OS's settings for grown-ups (Ollie OS Settings changes them).
# SCREEN_TIME  minutes a day the computer may be used (0: no limit)
# SCANNER      on/off: the Inappropriate Typing Scanner
# ASKED        yes once someone was asked about the scanner
# PIN_MD5      the parent PIN (as a check sum, not the PIN itself); empty: none
# FIREFOX_SHA256  Firefox's password (as a check sum); empty: none
# FIREFOX_ASKED   yes once someone was asked about it
SCREEN_TIME=0
SCANNER=off
ASKED=no
PIN_MD5=
FIREFOX_SHA256=
FIREFOX_ASKED=no
