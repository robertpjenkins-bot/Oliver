name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  appimage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Install FUSE for appimagetool
        run: sudo apt-get update && sudo apt-get install -y libfuse2
      - name: Build AppImage
        run: make appimage
      - name: Build Zip Transform AppImage
        run: make ziptransform-appimage
      - uses: actions/upload-artifact@v4
        with:
          name: oliver-appimage
          path: dist/Oliver-*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: ziptransform-appimage
          path: dist/ZipTransform-*.AppImage
