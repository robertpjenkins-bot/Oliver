name: Annie OS ISO

on:
  push:
    branches: ["**"]
    paths:
      - "annie-os/**"
      - "cmd/**"
      - "internal/**"
      - "packaging/**"
      - ".github/workflows/annie-os.yml"
  workflow_dispatch:

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The live image holds KDE, Steam and Firefox; the runner's preinstalled
      # SDKs leave too little disk to assemble it.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Check the installer scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -s bash annie-os/airootfs/usr/local/bin/annie-installer annie-os/airootfs/usr/local/bin/annie-install-backend annie-os/build.sh annie-os/build-in-docker.sh
          shellcheck -s sh annie-os/airootfs/usr/local/bin/annie-live-setup annie-os/airootfs/usr/local/bin/annie-set-wallpaper

      - name: Build ISO
        run: ./annie-os/build-in-docker.sh

      - uses: actions/upload-artifact@v4
        with:
          name: annie-os-iso
          path: annie-os/out/*.iso
          compression-level: 0
