name: Ollie OS ISO (edit the working one)

# Edits the ISO that is on the "Ollie OS (newest build)" release instead of
# building a new one: same programs, same versions, plus only the changes to
# os/profile/airootfs since the commit it was built from, and Firefox in
# place of Chrome. The edited ISO is tested like a new build, and only
# replaces the release when every test passes (the one it replaces is kept
# on the "ollie-os-before-edit" release).
on:
  workflow_dispatch:
    inputs:
      base_commit:
        description: Commit the ISO on the release was built from
        default: dc16a2a
  push:
    branches: ["**"]
    paths:
      - ".github/edit-iso/**"
      - ".github/workflows/os-iso-edit.yml"

permissions:
  contents: write
  actions: read

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Get the working ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base out
          gh release download ollie-os-newest -D base -p 'ollie-os-*.iso'
          ls -la base

      - name: What changes
        run: |
          git diff --name-only "${{ inputs.base_commit || 'dc16a2a' }}" HEAD -- os/profile/airootfs >changed.txt
          cat changed.txt

      - name: Edit it
        run: |
          iso="$(ls base/*.iso | head -n1)"
          docker run --rm --privileged -v "$PWD:/src" -w /src archlinux:latest \
            bash .github/edit-iso/edit-iso.sh "$iso" "out/$(basename "$iso")" changed.txt
          ls -la out
          size=$(($(stat -c %s out/*.iso) / 1048576))
          echo "edited ISO: $size MB"
          ((size < 2047)) || { echo "too big for one release file"; exit 1; }

      - name: Put it on a test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ollie-os-edited-test --yes --cleanup-tag 2>/dev/null || true
          gh release create ollie-os-edited-test --prerelease --target "$GITHUB_SHA" \
            --title "Ollie OS (edited, being tested)" \
            --notes "The working ISO with only the latest changes added. Being tested; use the Ollie OS (newest build) release." \
            out/*.iso out/*.sha256

  test:
    needs: edit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Get the edited ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p iso
          gh release download ollie-os-edited-test -D iso -p '*.iso'
          ls -la iso

      - name: Make room on the runner
        run: |
          # Unpacking the system image needs about 10 GB.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af
          df -h / /mnt

      - name: Install test tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xorriso squashfs-tools qemu-system-x86 socat imagemagick tesseract-ocr
          # Let the test use hardware virtualisation.
          sudo chmod 666 /dev/kvm || true

      - name: Check what is inside the ISO
        run: |
          # Unpack on whichever disk has more room.
          tmp=/mnt/ollie-check
          sudo mkdir -p "$tmp"
          sudo TMPDIR="$tmp" bash os/tests/check-iso.sh "$(find iso -name '*.iso' | head -n1)"

      - name: Boot the ISO
        if: always()
        run: bash os/tests/boot-iso.sh "$(find iso -name '*.iso' | head -n1)" boot 15

      - name: "First start: create a username and password, then log in (QEMU)"
        if: always()
        run: bash os/tests/account-flow.sh qemu "$(find iso -name '*.iso' | head -n1)" account

      - name: "First start the way GNOME Boxes runs it: older PC, QXL graphics, 30 GB disk"
        if: always()
        run: bash os/tests/account-flow.sh boxes "$(find iso -name '*.iso' | head -n1)" boxes

      - name: "The Fixer: break a program on purpose and let The Fixer repair it"
        if: always()
        run: bash os/tests/fixer-test.sh "$(find iso -name '*.iso' | head -n1)" fixer

      - name: Show the first-start screenshots
        if: always()
        run: |
          for f in account/step-*.png boxes/step-*.png; do
            [[ -f "$f" ]] || continue
            convert "$f" -resize 800x -quality 55 "${f%.png}.jpg"
            echo "=== SCREENSHOT $(basename "$(dirname "$f")")-$(basename "${f%.png}") BEGIN"
            base64 -w 0 "${f%.png}.jpg"
            echo
            echo "=== SCREENSHOT END"
          done

      - name: Show the last screenshots
        if: always()
        run: |
          # Printed into the log as base64 so they can be read without
          # downloading the artifact.
          for f in $(ls boot/screen-*.png 2>/dev/null | tail -n 3); do
            convert "$f" -resize 960x -quality 60 "${f%.png}.jpg"
            echo "=== SCREENSHOT $(basename "${f%.png}") BEGIN"
            base64 -w 0 "${f%.png}.jpg"
            echo
            echo "=== SCREENSHOT END"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ollie-os-edit-boot-test
          path: |
            boot/*.png
            boot/serial.log
            boot/summary.txt
            account/step-*.png
            account/ocr-*.txt
            account/serial.log
            account/summary.txt
            boxes/step-*.png
            boxes/serial.log
            boxes/summary.txt
          retention-days: 7


  virtualbox:
    needs: edit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Get the edited ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p iso
          gh release download ollie-os-edited-test -D iso -p '*.iso'
          ls -la iso

      - name: Install VirtualBox
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q \
            virtualbox virtualbox-dkms "linux-headers-$(uname -r)" xorriso imagemagick tesseract-ocr
          # VirtualBox needs the processor's virtualisation to itself.
          sudo modprobe -r kvm_amd kvm_intel kvm 2>/dev/null || true
          sudo modprobe vboxdrv
          VBoxManage --version

      - name: "First start: create a username and password, then log in (VirtualBox)"
        run: bash os/tests/account-flow.sh vbox "$(find iso -name '*.iso' | head -n1)" vbox

      - name: Show the VirtualBox screenshots
        if: always()
        run: |
          for f in vbox/step-*.png; do
            [[ -f "$f" ]] || continue
            convert "$f" -resize 800x -quality 55 "${f%.png}.jpg"
            echo "=== SCREENSHOT vbox-$(basename "${f%.png}") BEGIN"
            base64 -w 0 "${f%.png}.jpg"
            echo
            echo "=== SCREENSHOT END"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ollie-os-edit-virtualbox-test
          path: |
            vbox/step-*.png
            vbox/ocr-*.txt
            vbox/VBox.log
            vbox/vbox-serial.log
            vbox/summary.txt
          retention-days: 7

  publish:
    needs: [test, virtualbox]
    runs-on: ubuntu-latest
    steps:
      - name: Replace the ISO on the release, keeping the old one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p old new
          # Keep the ISO being replaced (only the first time: the original).
          if ! gh release view ollie-os-before-edit >/dev/null 2>&1; then
            gh release download ollie-os-newest -D old -p 'ollie-os-*.iso*'
            gh release create ollie-os-before-edit --prerelease --title "Ollie OS (before the edit)" \
              --notes "The ISO as it was before it was edited, kept in case it is needed." old/*
          fi
          gh release download ollie-os-edited-test -D new -p '*'
          gh release upload ollie-os-newest new/* --clobber
          gh release view ollie-os-newest --json assets --jq '.assets[] | "\(.name) \(.size) \(.updatedAt)"'
