name: Annie OS ISO

on:
  push:
    paths:
      - "annie-os/**"
      - "!annie-os/usb/**"
      - "!annie-os/updater/**"
      - "!annie-os/**/*.md"
      - ".github/workflows/annie-iso.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # The runner ships ~30 GB of SDKs we don't need; the ISO build needs the room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v4

      # mkarchiso has to run on Arch, so build inside the official Arch image.
      - name: Build the ISO
        run: |
          docker run --rm --privileged -v "$PWD:/src" -w /src/annie-os archlinux:latest bash -euxc '
            pacman -Syu --noconfirm --needed archiso go git
            git config --global --add safe.directory /src
            ./build.sh
          '
          sudo chown -R "$(id -u):$(id -g)" annie-os/iso
          ls -lh annie-os/iso

      - name: Build the USB Maker
        run: |
          ./annie-os/usb/build-appimage.sh
          ./annie-os/updater/build-appimage.sh

      - name: Checksum
        run: cd annie-os/iso && sha256sum *.iso | tee SHA256SUMS

      # Published as a release rather than an artifact: releases don't count
      # against the account's artifact storage, which the ISO would fill.
      # GitHub caps each release file at 2 GiB, so a bigger ISO goes up in parts.
      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd annie-os/iso
          iso=$(ls *.iso)
          files=("$iso" SHA256SUMS ../out/Annie-OS-*-x86_64.AppImage)
          notes="Annie OS live ISO.

          Easiest: download Annie-OS-USB-Maker-x86_64.AppImage with the ISO (or its parts, or a zip of them), run it on Linux or SteamOS and pick your USB drive (8 GB or more). It joins the parts for you and keeps your files on the drive. Annie-OS-USB-Maker-Zip-x86_64.AppImage does the same but only takes a zip.

          Or write the ISO with balenaEtcher, Ventoy or dd."
          if [ "$(stat -c %s "$iso")" -ge 2147483648 ]; then
            split -b 1900M -d "$iso" "$iso.part"
            files=("$iso".part* SHA256SUMS ../out/Annie-OS-*-x86_64.AppImage)
            notes="$notes

          The ISO is split in parts because GitHub limits release files to 2 GB. Download every part, then join them:
          - Linux / Mac: cat $iso.part* > $iso
          - Windows: copy /b $iso.part00+$iso.part01 $iso"
          fi
          tag="annie-os-$(date +%Y.%m.%d)-run${{ github.run_number }}"
          gh release create "$tag" "${files[@]}" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Annie OS $(date +%Y.%m.%d)" --notes "$notes" --prerelease
