name: Annie OS ISO

on:
  push:
    paths:
      - "annie-os/**"
      - ".github/workflows/annie-iso.yml"
  workflow_dispatch:

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # The runner ships ~30 GB of SDKs we don't need; the ISO build needs the room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v4

      # mkarchiso has to run on Arch, so build inside the official Arch image.
      - name: Build the ISO
        run: |
          docker run --rm --privileged -v "$PWD:/src" -w /src/annie-os archlinux:latest bash -euxc '
            pacman -Syu --noconfirm --needed archiso go git
            git config --global --add safe.directory /src
            ./build.sh
          '
          sudo chown -R "$(id -u):$(id -g)" annie-os/iso
          ls -lh annie-os/iso

      - name: Checksum
        run: cd annie-os/iso && sha256sum *.iso | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: annie-os-iso
          path: |
            annie-os/iso/*.iso
            annie-os/iso/SHA256SUMS
          compression-level: 0
          retention-days: 30
