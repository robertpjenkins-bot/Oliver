name: Etros

# Tests for Etros and its installer. The installer itself is built with
# etros/installer/build-dist.sh; nothing here builds or publishes a card.

on:
  pull_request:
    paths: ['etros/**', '.github/workflows/etros.yml']
  push:
    branches: [claude/happy-heisenberg-5vvn6r]
    paths: ['etros/**', '.github/workflows/etros.yml']

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: etros/installer/go.mod
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck busybox squashfs-tools \
            mtools u-boot-tools lz4 cpio fdisk dosfstools e2fsprogs xz-utils
      - name: Lint
        run: |
          cd etros
          shellcheck -s bash layer/etc/init.d/S13etros layer/usr/bin/etros-* initrd/etros-hook.sh scripts/*.sh installer/*.sh
          shellcheck -s sh ollie/files/usr/local/sbin/ollie-setup ollie/files/usr/local/bin/ollie-boot-batocera \
            ollie/files/usr/local/bin/ollie-wifi-from-batocera ollie/files/usr/local/bin/ollie-keyboard-toggle \
            ollie/files/etc/systemd/system-generators/ollie-generator
          shellcheck -e SC2016 test/*.sh
          test -z "$(gofmt -l installer)"
      - name: Batocera's initramfs
        run: |
          base=https://raw.githubusercontent.com/batocera-linux/batocera.linux/master/package/batocera/boot/batocera-initramfs
          curl -fsSL -o init "$base/init"
          curl -fsSL -o busybox.config "$base/busybox.config"
      - name: Unit tests
        run: |
          python3 -m unittest discover -s etros/test -v
          cd etros/installer && BATOCERA_INIT=$GITHUB_WORKSPACE/init go test -v ./...
      - name: Install onto an image file from stand-in downloads
        run: |
          sudo etros/test/make-fake-images.sh init fake
          (cd etros/installer && go build -o ../../etros-installer .)
          ETROS_SMALL_FILE=10 ./etros-installer -target file:card.img -pi5-boot fake/pi5-boot.tar.xz \
            -r36s-boot fake/r36s-boot.tar.xz -r36s-image fake/r36s.img.gz -rpios fake/rpios.img.xz
          start=$(sfdisk -J card.img | jq '.partitiontable.partitions[0].start')
          size=$(sfdisk -J card.img | jq '.partitiontable.partitions[0].size')
          dd if=card.img of=fat.img bs=512 skip="$start" count="$size" status=none
          fsck.fat -n fat.img
          MTOOLS_SKIP_CHECK=1 mcopy -i fat.img ::/etros/pi5/initrd.lz4 pi5-initrd.lz4
      - name: Boot checks
        run: sudo etros/test/initrd-test.sh pi5-initrd.lz4 etros/installer/assets/etros.squashfs busybox.config
