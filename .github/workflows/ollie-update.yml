name: Ollie OS update

# Publishes Ollie OS updates, which every Ollie OS with the Update Checker
# then tells its person about. An update is a file updates/NAME.md: its
# first line is the update's name, the rest says what is new. When one is
# pushed, this makes the release "ollie-update-NAME" (the tag too) with
# downloads/Ollie-OS-Latest-Updater-x86_64.AppImage, in the form the Update
# Checker reads (ollie-update-checker). An update already published is left
# as it is.
on:
  push:
    branches: ["claude/fervent-gates-cs7smv", "claude/clever-johnson-3ittch"]
    paths: ["updates/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the updates not published yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file=downloads/Ollie-OS-Latest-Updater-x86_64.AppImage
          test -s "$file"
          for notes in updates/*.md; do
            [[ -f $notes ]] || continue
            tag="ollie-update-$(basename "$notes" .md)"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag: already published"
              continue
            fi
            title="$(head -n 1 "$notes" | sed 's/^#* *//')"
            what="$(tail -n +2 "$notes" | sed '1{/^$/d}')"
            body="$(printf '%s\n\n<!-- ollie-update -->\n*An Ollie OS update. Ollie OS'"'"'s Update Checker tells you about it: install it from the notification, or from Ollie OS Updates in the apps menu.*\n' "$what")"
            gh release create "$tag" --target "$GITHUB_SHA" --title "${title:-$tag}" --notes "$body" --latest=false "$file"
            echo "$tag: published"
          done
