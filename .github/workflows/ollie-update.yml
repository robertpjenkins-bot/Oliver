name: Ollie OS update

# Publishes an Ollie OS update, which every Ollie OS with the Update Checker
# then tells its person about: pushing a tag "ollie-update-..." (an annotated
# tag: its first line is the update's name, the rest says what is new) makes
# a release of it with downloads/Ollie-OS-Latest-Updater-x86_64.AppImage, in
# the form the Update Checker reads (ollie-update-checker).
on:
  push:
    tags: ["ollie-update-*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish the update
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The tag itself (with its message), not just the commit.
          git fetch -f origin "refs/tags/$TAG:refs/tags/$TAG"
          title="$(git for-each-ref --format='%(contents:subject)' "refs/tags/$TAG")"
          what="$(git for-each-ref --format='%(contents:body)' "refs/tags/$TAG")"
          file=downloads/Ollie-OS-Latest-Updater-x86_64.AppImage
          test -s "$file"
          body="$(printf '%s\n\n<!-- ollie-update -->\n*An Ollie OS update. Ollie OS'"'"'s Update Checker tells you about it: install it from the notification, or from Ollie OS Updates in the apps menu.*\n' "$what")"
          gh release create "$TAG" --title "${title:-$TAG}" --notes "$body" --latest=false "$file"
