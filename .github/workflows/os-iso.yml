name: Ollie OS ISO

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "os/**"
      - "cmd/**"
      - "internal/**"
      - "packaging/**"
      - ".github/workflows/os-iso.yml"
    tags: ["os-v*"]

permissions:
  contents: read
  actions: read

jobs:
  # When a push changes only the tests, test the newest ISO already built for
  # this branch instead of spending an hour building an identical one.
  plan:
    runs-on: ubuntu-latest
    outputs:
      reuse_run: ${{ steps.plan.outputs.reuse_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          reuse=""
          if [[ "${{ github.event_name }}" == push && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] &&
             git cat-file -e "$BEFORE" 2>/dev/null; then
            changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
            echo "changed:"; echo "$changed"
            if [[ -n "$changed" ]] && ! grep -qvE '^(os/tests/|\.github/workflows/os-iso\.yml$)' <<<"$changed"; then
              reuse="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ollie-os-iso&per_page=30" \
                --jq "[.artifacts[] | select(.expired == false and .workflow_run.head_branch == \"$GITHUB_REF_NAME\")][0].workflow_run.id // empty")"
            fi
          fi
          echo "reuse_run=$reuse" >>"$GITHUB_OUTPUT"
          echo "reusing the ISO from run: ${reuse:-none, building a new one}"

  usb-maker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Ollie OS USB Maker
        run: bash os/usb/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ollie-os-usb-maker
          path: os/out/Ollie-OS-USB-Maker-x86_64.AppImage

  iso:
    needs: plan
    if: needs.plan.outputs.reuse_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Build the ISO in an Arch Linux container
        run: |
          docker run --rm --privileged -v "$PWD:/src" -w /src archlinux:latest bash os/build.sh

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: ollie-os-iso
          path: |
            os/out/*.iso
            os/out/*.sha256
            os/ollie-write
          compression-level: 0
          retention-days: 14

      - name: Build Ollie OS USB Maker for the release
        if: startsWith(github.ref, 'refs/tags/os-v')
        run: sudo bash os/usb/build-appimage.sh

      - name: Publish a release for os-v* tags
        if: startsWith(github.ref, 'refs/tags/os-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            os/out/*.iso
            os/out/*.AppImage
            os/out/*.sha256
            os/ollie-write

  test:
    needs: [plan, iso]
    if: always() && (needs.iso.result == 'success' || needs.plan.outputs.reuse_run != '')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ollie-os-iso
          path: iso
          run-id: ${{ needs.plan.outputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Make room on the runner
        run: |
          # Unpacking the system image needs about 10 GB.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af
          df -h / /mnt

      - name: Install test tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xorriso squashfs-tools qemu-system-x86 socat imagemagick
          # Let the test use hardware virtualisation.
          sudo chmod 666 /dev/kvm || true

      - name: Check what is inside the ISO
        run: |
          # Unpack on whichever disk has more room.
          tmp=/mnt/ollie-check
          sudo mkdir -p "$tmp"
          sudo TMPDIR="$tmp" bash os/tests/check-iso.sh "$(find iso -name '*.iso' | head -n1)"

      - name: Boot the ISO
        if: always()
        run: bash os/tests/boot-iso.sh "$(find iso -name '*.iso' | head -n1)" boot 15

      - name: Show the last screenshots
        if: always()
        run: |
          # Printed into the log as base64 so they can be read without
          # downloading the artifact.
          for f in $(ls boot/screen-*.png 2>/dev/null | tail -n 3); do
            convert "$f" -resize 960x -quality 60 "${f%.png}.jpg"
            echo "=== SCREENSHOT $(basename "${f%.png}") BEGIN"
            base64 -w 0 "${f%.png}.jpg"
            echo
            echo "=== SCREENSHOT END"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ollie-os-boot-test
          path: |
            boot/*.png
            boot/serial.log
            boot/summary.txt
          retention-days: 14
