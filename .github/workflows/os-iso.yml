name: Ollie OS ISO

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "os/**"
      - "cmd/**"
      - "internal/**"
      - "packaging/**"
      - ".github/workflows/os-iso.yml"
    tags: ["os-v*"]

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Build the ISO in an Arch Linux container
        run: |
          docker run --rm --privileged -v "$PWD:/src" -w /src archlinux:latest bash os/build.sh

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: ollie-os-iso
          path: |
            os/out/*.iso
            os/out/*.sha256
            os/ollie-write
          compression-level: 0
          retention-days: 14

      - name: Publish a release for os-v* tags
        if: startsWith(github.ref, 'refs/tags/os-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            os/out/*.iso
            os/out/*.sha256
            os/ollie-write
