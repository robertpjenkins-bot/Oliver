# The Pi 5 has two graphics devices: v3d draws, vc4 drives the screen. X
# picks the first one it finds, v3d, which has no screen at all, so the
# login screen never shows (Raspberry Pi OS has its own copy of this; Arch
# Linux doesn't). Make vc4, the one with the screen, the main one.
Section "OutputClass"
    Identifier "vc4"
    MatchDriver "vc4"
    Driver "modesetting"
    Option "PrimaryGPU" "true"
EndSection
