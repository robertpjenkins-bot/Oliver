# Etros on an Intel Mac: GRUB in place of Batocera's Secure Boot shim (whose
# fallback leaves a Mac on a black screen). It reads Batocera's own
# EFI/BOOT/grub.cfg from the partition it was started from (GRUB's root to
# begin with).
set gfxpayload=keep
export gfxpayload
export root
configfile /EFI/BOOT/grub.cfg
