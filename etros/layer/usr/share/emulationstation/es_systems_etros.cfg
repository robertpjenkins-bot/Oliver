<?xml version="1.0"?>
<systemList>
	<system>
		<name>etros</name>
		<fullname>Etros</fullname>
		<manufacturer>Etros</manufacturer>
		<release>2026</release>
		<hardware>system</hardware>
		<path>/userdata/roms/etros</path>
		<extension>.sh</extension>
		<command>/usr/bin/etros-launch %ROM%</command>
		<platform>ignore</platform>
		<theme>etros</theme>
	</system>
	<system>
		<name>windows</name>
		<fullname>Windows</fullname>
		<manufacturer>Microsoft</manufacturer>
		<release>1985</release>
		<hardware>pc</hardware>
		<path>/userdata/roms/windows</path>
		<extension>.exe .EXE .msi .MSI .bat .BAT .lnk .LNK</extension>
		<command>/usr/bin/etros-launch-windows %ROM%</command>
		<platform>pc</platform>
		<theme>windows</theme>
	</system>
	<system>
		<name>os</name>
		<fullname>Old operating systems</fullname>
		<manufacturer>Various</manufacturer>
		<release>1981</release>
		<hardware>pc</hardware>
		<path>/userdata/roms/os</path>
		<extension>.iso .ISO .img .IMG .ima .IMA .vhd .VHD .cue .CUE</extension>
		<command>/usr/bin/etros-launch-os %ROM%</command>
		<platform>pc</platform>
		<theme>dos</theme>
	</system>
</systemList>
